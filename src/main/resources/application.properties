server.port=${PORT:8080}

# Spring Data MongoDB (Soporta variable de entorno MONGODB_URI o SPRING_DATA_MONGODB_URI)
spring.data.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/nexa_insights_db}}
spring.data.mongodb.auto-index-creation=true

# Multipart configuration for files (up to 100MB)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Groq AI Configuration
# Por defecto utiliza la variable de entorno GROQ_API_KEY
groq.api.key=${GROQ_API_KEY:gsk_your_groq_api_key_here}
groq.api.model=${GROQ_API_MODEL:openai/gpt-oss-120b}
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# Logging
logging.level.com.nexainsights=INFO
logging.level.org.springframework.data.mongodb=WARN
